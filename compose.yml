
services:

  frontend:

    build: ./frontend

    container_name: frontend

    ports:
      - "8080:80"

    networks:
      - frontend-network

    depends_on:
      - backend

    restart: unless-stopped


  backend:

    build: ./backend

    container_name: backend

    environment:
      MONGO_URL: mongodb://database:27017/studentdb

    expose:
      - "3000"

    networks:
      - frontend-network
      - backend-network

    depends_on:
      database:
        condition: service_healthy

    restart: unless-stopped


  database:

    image: mongo:8

    container_name: database

    environment:
      MONGO_INITDB_DATABASE: studentdb

    volumes:
      - mongo-data:/data/db

    networks:
      - backend-network

    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "db.adminCommand('ping').ok"
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped


volumes:

  mongo-data:


networks:

  frontend-network:

  backend-network:
    internal: true
